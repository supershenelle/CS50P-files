name: Sync CS50 Code
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Portfolio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Clone and Sync CS50 Repo
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git clone https://${{ secrets.SYNC_TOKEN }}@github.com/code50/186777976.git temp_cs50
          
          rsync -av --exclude='.git' temp_cs50/ .
          rm -rf temp_cs50
          
          git add .
          git diff-index --quiet HEAD || git commit -m "Automated sync from CS50"
          git push origin main
